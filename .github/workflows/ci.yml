name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-docs:
    name: Tests, format, and DocC
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run tests
        run: swift test

      - name: Lint Swift formatting
        run: swift format lint --recursive Sources Tests

      - name: Validate DocC
        run: swift package generate-documentation --target SimpleOverlaySystem

  supported-platform-builds:
    name: iOS, tvOS, and Mac Catalyst builds
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for iOS
        run: |
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build \
            --scratch-path .build/ios \
            --triple arm64-apple-ios17.0 \
            --sdk "$IOS_SDK"

      - name: Build for tvOS
        run: |
          TVOS_SDK="$(xcrun --sdk appletvos --show-sdk-path)"
          swift build \
            --scratch-path .build/tvos \
            --triple arm64-apple-tvos17.0 \
            --sdk "$TVOS_SDK"

      - name: Build for Mac Catalyst
        run: |
          MACOS_SDK="$(xcrun --sdk macosx --show-sdk-path)"
          IOS_SUPPORT="$MACOS_SDK/System/iOSSupport"
          swift build \
            --scratch-path .build/catalyst \
            --triple arm64-apple-ios17.0-macabi \
            --sdk "$MACOS_SDK" \
            -Xswiftc -F \
            -Xswiftc "$IOS_SUPPORT/System/Library/Frameworks" \
            -Xswiftc -I \
            -Xswiftc "$IOS_SUPPORT/usr/lib/swift"
