name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-tests-and-docs:
    name: macOS tests, format, and DocC
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run CI-safe tests
        run: swift test
        env:
          SIMPLE_OVERLAY_RUN_WINDOW_TESTS: "0"

      - name: Lint Swift formatting
        run: swift format lint --recursive Sources Tests

      - name: Validate DocC
        run: swift package generate-documentation --target SimpleOverlaySystem

  ios-build:
    name: iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for iOS
        run: |
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build \
            --scratch-path .build/ios \
            --triple arm64-apple-ios17.0 \
            --sdk "$IOS_SDK"
